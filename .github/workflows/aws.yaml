name: Deploy Application Docker Image to EC2 instance

on:
  push:
    branches:
      - main


jobs:

  # ==========================================================
  # CONTINUOUS INTEGRATION
  # ==========================================================

  Continuous-Integration:

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Configure AWS
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}


      # --------------------------------------------------------
      # Login to ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # Build and Push Docker Image
      # --------------------------------------------------------

      - name: Build, tag, and push image to Amazon ECR

        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
          IMAGE_TAG: latest

        run: |

          echo "========================================"
          echo "Building Docker Image"
          echo "========================================"

          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            .


          echo "========================================"
          echo "Pushing Docker Image"
          echo "========================================"

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG


          echo "========================================"
          echo "CI Completed Successfully"
          echo "========================================"


  # ==========================================================
  # CONTINUOUS DEPLOYMENT
  # ==========================================================

  Continuous-Deployment:

    needs: Continuous-Integration

    runs-on: self-hosted

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Configure AWS
      # --------------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}


      # --------------------------------------------------------
      # Login to ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # Stop Existing Container
      # --------------------------------------------------------

      - name: Stop Existing Container

        run: |

          echo "========================================"
          echo "Checking Existing Containers"
          echo "========================================"

          docker ps -a


          echo "========================================"
          echo "Stopping Old Application"
          echo "========================================"

          docker stop vehicle-insurance-app 2>/dev/null || true


          echo "========================================"
          echo "Removing Old Application"
          echo "========================================"

          docker rm vehicle-insurance-app 2>/dev/null || true


          echo "========================================"
          echo "Checking Containers After Cleanup"
          echo "========================================"

          docker ps -a


      # --------------------------------------------------------
      # Pull Latest Image
      # --------------------------------------------------------

      - name: Pull Latest Docker Image

        run: |

          echo "========================================"
          echo "Pulling Latest Image"
          echo "========================================"

          docker pull \
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:latest


      # --------------------------------------------------------
      # Run Docker Container
      # --------------------------------------------------------

      - name: Run Docker Image

        run: |

          echo "========================================"
          echo "Starting Application"
          echo "========================================"

          docker run -d \
            --name vehicle-insurance-app \
            -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
            -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
            -e AWS_DEFAULT_REGION="${{ secrets.AWS_DEFAULT_REGION }}" \
            -e MONGODB_URL="${{ secrets.MONGODB_URL }}" \
            -p 5000:5000 \
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPO }}:latest


      # --------------------------------------------------------
      # Check Container
      # --------------------------------------------------------

      - name: Check Container

        run: |

          echo "========================================"
          echo "Docker PS"
          echo "========================================"

          docker ps


          echo "========================================"
          echo "Container Logs"
          echo "========================================"

          docker logs vehicle-insurance-app --tail 50


          echo "========================================"
          echo "Testing Application"
          echo "========================================"

          sleep 5

          curl -f http://localhost:5000/health


          echo ""
          echo "========================================"
          echo "Deployment Successful"
          echo "========================================"



          